      - name: The built bundle exposes a named accessibility tree in a real browser
        shell: node .pool-trusted/tooling/ci/quiet-step.mjs --name lane-build.web-artifacts.16 --default-shell {0}
        run: node tooling/smoke/web-a11y-tree.mjs apps/${{ fromJSON(inputs.matrix).app }}/build/web
      - name: Install the fleet Playwright and axe-core (lockfile)
        shell: node ../.pool-trusted/tooling/ci/quiet-step.mjs --name lane-build.web-artifacts.17 --default-shell {0}
        working-directory: _playwright
        run: node "$GITHUB_WORKSPACE/tooling/ops/npm-ci-retry.mjs" -- npm ci --no-audit --no-fund
