        shell: node .pool-trusted/tooling/ci/quiet-step.mjs --name lane-build.linux-artifacts.9 --default-shell {0}
        run: >
          node tooling/ci/assert-artifact-shape.mjs
          --app ${{ fromJSON(inputs.matrix).app }} --platform linux-artifacts --arch ${{ fromJSON(inputs.matrix).arch }}
