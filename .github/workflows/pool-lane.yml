        run: >
          node tooling/release/generate-snapcraft.mjs
          --app ${{ fromJSON(inputs.matrix).app }}
          --bundle apps/${{ fromJSON(inputs.matrix).app }}/build/linux/${{ fromJSON(inputs.matrix).arch }}/release/bundle
          --out "$RUNNER_TEMP/snapcraft-${{ fromJSON(inputs.matrix).app }}"
          --version ${{ steps.ver.outputs.release_line }}.${{ github.run_number }}
      - name: The generated recipe is complete and still derived from the tree
