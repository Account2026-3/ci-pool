  build-artifacts--linux-artifacts:
    # generated from lane-build.yml job linux-artifacts: its steps after its checkout, verbatim but for matrix.shard → inputs.shard,
    # quiet-step around every run, and no artifact step (a pool repository is public).
    if: inputs.lane == 'build-artifacts' && inputs.job == 'linux-artifacts'
    name: build-artifacts · linux-artifacts ${{ inputs.matrix }}
    runs-on: ${{ fromJSON(inputs.matrix).arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
