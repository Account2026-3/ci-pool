  build-artifacts--web-artifacts:
    # generated from lane-build.yml job web-artifacts: its steps after its checkout, verbatim but for matrix.shard → inputs.shard,
    # quiet-step around every run, and no artifact step (a pool repository is public).
    if: inputs.lane == 'build-artifacts' && inputs.job == 'web-artifacts'
    name: build-artifacts · web-artifacts ${{ inputs.matrix }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: The inputs are what the parent sends
        env:
          IN_SHA: ${{ inputs.sha }}
          IN_CHECKOUT_SHA: ${{ inputs.checkout_sha }}
          IN_PARENT_RUN: ${{ inputs.parent_run }}
          IN_PARENT_ATTEMPT: ${{ inputs.parent_attempt }}
          IN_LANE: ${{ inputs.lane }}
          IN_JOB: ${{ inputs.job }}
          IN_SHARD: ${{ inputs.shard }}
          IN_IDENTITY: ${{ inputs.identity }}
          IN_MATRIX: ${{ inputs.matrix }}
          IN_NEEDS: ${{ inputs.needs }}
        run: |
          set -euo pipefail
          [[ "$IN_SHA" =~ ^[0-9a-f]{40}$ && "$IN_CHECKOUT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha and checkout_sha must be 40-hex"; exit 1; }
          [[ "$IN_PARENT_RUN" =~ ^[1-9][0-9]{0,19}$ && "$IN_PARENT_ATTEMPT" =~ ^[1-9][0-9]{0,4}$ ]] || { echo "::error::parent_run and parent_attempt must be positive integers"; exit 1; }
          [[ "$IN_SHARD" =~ ^([1-9][0-9]?)?$ ]] || { echo "::error::shard must be empty or a small positive integer"; exit 1; }
          jq -e --argjson want '["app"]' 'type == "object" and ((keys | sort) == ($want | sort)) and all(.[]; type == "string" and test("^[A-Za-z0-9._-]{1,100}$") and . != "." and . != "..")' <<<"$IN_MATRIX" >/dev/null || { echo "::error::matrix is not this job's {key: value}"; exit 1; }
          jq -e --argjson want '{}' 'type == "object" and ((keys | sort) == ($want | keys | sort)) and all(to_entries[]; (.value | type == "object") and ((.value | keys | sort) == ($want[.key] | sort)) and all(.value[]; type == "string" and length <= 4096))' <<<"$IN_NEEDS" >/dev/null || { echo "::error::needs is not exactly the outputs this job reads"; exit 1; }
          jq -e 'type == "object" and ((keys - ["event","ref","base_sha","base_ref","pr"]) | length == 0) and ((.event // "") | test("^[a-z_]{0,32}$")) and ((.ref // "") | test("^(refs/(heads|tags|pull)/[A-Za-z0-9._/-]{1,200})?$")) and ((.base_sha // "") | test("^([0-9a-f]{40})?$")) and ((.base_ref // "") | test("^[A-Za-z0-9._/-]{0,200}$")) and ((.pr // "") | tostring | test("^([1-9][0-9]{0,9})?$"))' <<<"$IN_IDENTITY" >/dev/null || { echo "::error::identity is not the parent's {event, ref, base_sha, base_ref, pr}"; exit 1; }
      - name: Check out the private code with the bridge's read-only token (POST /pool-checkout), retried with a fresh one
        id: pool-checkout
        shell: bash
        env:
          IN_SHA: ${{ inputs.sha }}
          IN_CHECKOUT_SHA: ${{ inputs.checkout_sha }}
          IN_REPO: com-nikatru/Nikatru_Private
          BRIDGE: https://gh-bridge.nikatru.workers.dev
          TRUSTED: .pool-trusted
        run: |
          set -uo pipefail
          # The bridge's token can 404 a fetch until it propagates: each retry asks for a FRESH one (pool-checkout.ts POOL_MINTS_PER_ATTEMPT).
          wait_s=(0 10 30 60)
          url="https://github.com/$IN_REPO"
          token=''
          why=''
          err="${RUNNER_TEMP:-/tmp}/pool-git.err"
          mint() {
            local oidc answer code
            oidc=$(curl -fsS --retry 3 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=nikatru-gh-bridge-propose" | jq -r .value) || { why='bridge: the OIDC token could not be minted'; return 1; }
            [[ -n "$oidc" && "$oidc" != null ]] || { why='bridge: the OIDC answer held no token'; return 1; }
            echo "::add-mask::$oidc"
            answer=$(curl -sS --retry 3 -w '\n%{http_code}' -X POST -H "content-type: application/json" -H "x-bridge-oidc: $oidc" --data "{\"sha\":\"$IN_SHA\"}" "$BRIDGE/pool-checkout") || { why='bridge: POST /pool-checkout could not be reached'; return 1; }
            code=${answer##*$'\n'}
            answer=${answer%$'\n'*}
            [[ "$code" == 200 ]] || { why="bridge: POST /pool-checkout answered HTTP $code ($(jq -r '.error // empty' <<<"$answer" 2>/dev/null | tr -cd '[:print:]' | head -c 160))"; return 1; }
            token=$(jq -r '.token // empty' <<<"$answer")
            [[ -n "$token" ]] || { why='bridge: the bridge returned no token'; return 1; }
            echo "::add-mask::$token"
          }
          # The token reaches git through the environment, never argv or a config file: no credential outlives the step.
          authed() {
            local basic
            basic=$(printf 'x-access-token:%s' "$token" | base64 | tr -d '\n')
            echo "::add-mask::$basic"
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0='http.https://github.com/.extraheader' GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $basic" git "$@" 2>"$err"
          }
          # A failed fetch, named by its class: git's own fetch lines say nothing of the private tree.
          fetch_why() {
            local e
            e=$(grep -E '^(fatal|error|remote):' "$err" | tail -2 | tr '\n' ' ' | tr -cd '[:print:]' | head -c 200)
            case "$e" in
              *'not found'* | *' 404'*) why="checkout: $1 404s (Repository not found) — $e" ;;
              *'expected'*'packfile'*) why="checkout: $1 ended before its packfile — $e" ;;
              *promisor*) why="checkout: $1 could not reach its promisor remote — $e" ;;
              *) why="checkout: $1 failed — $e" ;;
            esac
          }
          attempt() {
            mint || return 1
            git init -q . && { git remote remove origin 2>/dev/null; git remote add origin "$url"; } || { why='checkout: the workspace could not be initialised'; return 1; }
            authed fetch --no-tags --prune --no-recurse-submodules origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*' || { fetch_why 'the fetch of the private branches'; return 1; }
            if ! git cat-file -e "$IN_CHECKOUT_SHA^{commit}" 2>/dev/null; then
              authed fetch --no-tags --no-recurse-submodules origin "$IN_CHECKOUT_SHA" || { fetch_why "the fetch of checkout_sha $IN_CHECKOUT_SHA"; return 1; }
            fi
            git checkout -q --force --detach "$IN_CHECKOUT_SHA" 2>/dev/null || { why="checkout: checkout_sha $IN_CHECKOUT_SHA could not be checked out"; return 1; }
            rm -rf "$TRUSTED" && git init -q "$TRUSTED" && git -C "$TRUSTED" remote add origin "$url" && git -C "$TRUSTED" sparse-checkout set tooling/ci .github/actions || { why="checkout: $TRUSTED could not be initialised"; return 1; }
            authed -C "$TRUSTED" fetch --no-tags --depth 1 origin '+refs/heads/main:refs/remotes/origin/main' || { fetch_why "the fetch of private main into $TRUSTED"; return 1; }
            git -C "$TRUSTED" checkout -q --force -B main refs/remotes/origin/main 2>/dev/null || { why="checkout: private main could not be checked out into $TRUSTED"; return 1; }
          }
          for n in "${!wait_s[@]}"; do
            if (( n > 0 )); then
              echo "::warning::pool checkout attempt $n of ${#wait_s[@]} failed ($why); retrying in ${wait_s[n]} s with a fresh bridge token"
              sleep "${wait_s[n]}"
            fi
            if attempt; then
              echo "pool checkout: the private code at $IN_CHECKOUT_SHA and private main's tooling, attempt $((n + 1)) of ${#wait_s[@]}"
              exit 0
            fi
          done
          echo "::error::POOL-INFRA $why (after ${#wait_s[@]} attempts, each with a fresh bridge token)"
          exit 1
      - name: Keep private main's copies out of the checked-out tree
        run: printf '/.pool-trusted/\n' >> "$(git rev-parse --git-path info/exclude)"
      - name: Name the private commit (the shell prelude's identity, from the parent run)
        env:
          IN_SHA: ${{ inputs.sha }}
          IN_IDENTITY: ${{ inputs.identity }}
          IN_REPO: com-nikatru/Nikatru_Private
        run: |
          set -euo pipefail
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=$IN_SHA"
            echo "NIKATRU_EVENT_NAME=$(jq -r '.event // ""' <<<"$IN_IDENTITY")"
            ref=$(jq -r '.ref // ""' <<<"$IN_IDENTITY"); echo "NIKATRU_REF=$ref"; echo "NIKATRU_REF_NAME=${ref#refs/*/}"
            echo "NIKATRU_BASE_SHA=$(jq -r '.base_sha // ""' <<<"$IN_IDENTITY")"
            echo "NIKATRU_BASE_REF=$(jq -r '.base_ref // ""' <<<"$IN_IDENTITY")"
            echo "NIKATRU_PR=$(jq -r '.pr // ""' <<<"$IN_IDENTITY")"
            echo "NIKATRU_PRIVATE_REPO=$IN_REPO"
          } >> "$GITHUB_ENV"
      - uses: ./.pool-trusted/.github/actions/setup-flutter
      - name: The home job's work starts here
        run: 'true'
      - name: Resolve the workspace
        shell: node .pool-trusted/tooling/ci/quiet-step.mjs --name lane-build.web-artifacts.3 --default-shell {0}
        run: flutter pub get --enforce-lockfile
      - name: Derive the release line from pubspec
        shell: node .pool-trusted/tooling/ci/quiet-step.mjs --name lane-build.web-artifacts.4 --default-shell {0}
        id: ver
        run: node tooling/ci/assert-app-versioning.mjs --emit apps/${{ fromJSON(inputs.matrix).app }} >> "$GITHUB_OUTPUT"
      - name: Resolve this app's base href from the catalogue
        shell: node .pool-trusted/tooling/ci/quiet-step.mjs --name lane-build.web-artifacts.5 --default-shell {0}
        id: base
        run: node tooling/ci/assert-catalog-reachable.mjs --emit-base-href ${{ fromJSON(inputs.matrix).app }} >> "$GITHUB_OUTPUT"
      - name: The connect-src origins the launch smoke probes, read from the app's _headers
        shell: node .pool-trusted/tooling/ci/quiet-step.mjs --name lane-build.web-artifacts.6 --default-shell {0}
        id: connect
        run: node tooling/web/connect-origins.mjs --app ${{ fromJSON(inputs.matrix).app }} --emit-listed >> "$GITHUB_OUTPUT"
