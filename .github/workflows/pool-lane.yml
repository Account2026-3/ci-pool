# GENERATED by tooling/ops/gen-pool-shell.mjs from tooling/ci/ci-pools.json and each class's home job. Never edit:
# the shell's main CI regenerates it and pushes it to every listed pool (tooling/ops/pool-sync.mjs).
name: pool lane
run-name: pool ${{ inputs.sha }} parent ${{ inputs.parent_run }} attempt ${{ inputs.parent_attempt }} lane ${{ inputs.lane }}
on:
  workflow_dispatch:
    inputs:
      sha:
        description: the private head the parent shell run is for (the bridge binds the checkout token to it)
        required: true
        type: string
      checkout_sha:
        description: the commit the home job builds (the PR merge commit, or the sha)
        required: true
        type: string
      parent_run:
        required: true
        type: string
      parent_attempt:
        required: true
        type: string
      lane:
        required: true
        type: choice
        options:
          - guard-singles
          - apps-workspace
          - build-artifacts
          - sites-builds
          - workers-units
      job:
        description: the home job this child runs (of its class)
        required: true
        type: choice
        options:
          - guard-meta
          - guards-legal
          - guards-store
          - guards-chassis
          - workspace-gate
          - app-dryrun
          - android-artifacts
          - web-artifacts
          - linux-artifacts
          - site-tokens
          - site-shared
          - content-gate
          - sites
          - worker
      identity:
        description: the parent run's {event, ref, base_sha, base_ref, pr}, as JSON (the shell prelude's NIKATRU_* identity)
        required: true
        type: string
      shard:
        required: false
        type: string
        default: ''
      matrix:
        description: the unit's matrix values other than shard, as a JSON object of words (`{}` for a job with none)
        required: false
        type: string
        default: '{}'
      needs:
        description: "the other jobs' outputs this job's steps read, {job: {output: value}}, from the parent's waiter (`{}` for none)"
        required: false
        type: string
        default: '{}'
permissions: {}
jobs:
  guard-singles--guard-meta:
    # generated from lane-guards.yml job guard-meta: its steps after its checkout, verbatim but for matrix.shard → inputs.shard,
    # quiet-step around every run, and no artifact step (a pool repository is public).
    if: inputs.lane == 'guard-singles' && inputs.job == 'guard-meta'
    name: guard-singles · guard-meta
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - name: The inputs are what the parent sends
        env:
          IN_SHA: ${{ inputs.sha }}
          IN_CHECKOUT_SHA: ${{ inputs.checkout_sha }}
          IN_PARENT_RUN: ${{ inputs.parent_run }}
          IN_PARENT_ATTEMPT: ${{ inputs.parent_attempt }}
          IN_LANE: ${{ inputs.lane }}
          IN_JOB: ${{ inputs.job }}
          IN_SHARD: ${{ inputs.shard }}
          IN_IDENTITY: ${{ inputs.identity }}
          IN_MATRIX: ${{ inputs.matrix }}
          IN_NEEDS: ${{ inputs.needs }}
        run: |
          set -euo pipefail
          [[ "$IN_SHA" =~ ^[0-9a-f]{40}$ && "$IN_CHECKOUT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha and checkout_sha must be 40-hex"; exit 1; }
          [[ "$IN_PARENT_RUN" =~ ^[1-9][0-9]{0,19}$ && "$IN_PARENT_ATTEMPT" =~ ^[1-9][0-9]{0,4}$ ]] || { echo "::error::parent_run and parent_attempt must be positive integers"; exit 1; }
          [[ "$IN_SHARD" =~ ^([1-9][0-9]?)?$ ]] || { echo "::error::shard must be empty or a small positive integer"; exit 1; }
          jq -e --argjson want '[]' 'type == "object" and ((keys | sort) == ($want | sort)) and all(.[]; type == "string" and test("^[A-Za-z0-9._-]{1,100}$") and . != "." and . != "..")' <<<"$IN_MATRIX" >/dev/null || { echo "::error::matrix is not this job's {key: value}"; exit 1; }
          jq -e --argjson want '{}' 'type == "object" and ((keys | sort) == ($want | keys | sort)) and all(to_entries[]; (.value | type == "object") and ((.value | keys | sort) == ($want[.key] | sort)) and all(.value[]; type == "string" and length <= 4096))' <<<"$IN_NEEDS" >/dev/null || { echo "::error::needs is not exactly the outputs this job reads"; exit 1; }
          jq -e 'type == "object" and ((keys - ["event","ref","base_sha","base_ref","pr"]) | length == 0) and ((.event // "") | test("^[a-z_]{0,32}$")) and ((.ref // "") | test("^(refs/(heads|tags|pull)/[A-Za-z0-9._/-]{1,200})?$")) and ((.base_sha // "") | test("^([0-9a-f]{40})?$")) and ((.base_ref // "") | test("^[A-Za-z0-9._/-]{0,200}$")) and ((.pr // "") | tostring | test("^([1-9][0-9]{0,9})?$"))' <<<"$IN_IDENTITY" >/dev/null || { echo "::error::identity is not the parent's {event, ref, base_sha, base_ref, pr}"; exit 1; }
      - name: Check out the private code with the bridge's read-only token (POST /pool-checkout), retried with a fresh one
        id: pool-checkout
        shell: bash
        env:
          IN_SHA: ${{ inputs.sha }}
          IN_CHECKOUT_SHA: ${{ inputs.checkout_sha }}
          IN_REPO: com-nikatru/Nikatru_Private
          BRIDGE: https://gh-bridge.nikatru.workers.dev
          TRUSTED: .pool-trusted
        run: |
          set -uo pipefail
          # The bridge's token can 404 a fetch until it propagates: each retry asks for a FRESH one (pool-checkout.ts POOL_MINTS_PER_ATTEMPT).
          wait_s=(0 10 30 60)
          url="https://github.com/$IN_REPO"
          token=''
          why=''
          err="${RUNNER_TEMP:-/tmp}/pool-git.err"
          mint() {
            local oidc answer code
            oidc=$(curl -fsS --retry 3 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=nikatru-gh-bridge-propose" | jq -r .value) || { why='bridge: the OIDC token could not be minted'; return 1; }
            [[ -n "$oidc" && "$oidc" != null ]] || { why='bridge: the OIDC answer held no token'; return 1; }
            echo "::add-mask::$oidc"
            answer=$(curl -sS --retry 3 -w '\n%{http_code}' -X POST -H "content-type: application/json" -H "x-bridge-oidc: $oidc" --data "{\"sha\":\"$IN_SHA\"}" "$BRIDGE/pool-checkout") || { why='bridge: POST /pool-checkout could not be reached'; return 1; }
            code=${answer##*$'\n'}
            answer=${answer%$'\n'*}
            [[ "$code" == 200 ]] || { why="bridge: POST /pool-checkout answered HTTP $code ($(jq -r '.error // empty' <<<"$answer" 2>/dev/null | tr -cd '[:print:]' | head -c 160))"; return 1; }
            token=$(jq -r '.token // empty' <<<"$answer")
            [[ -n "$token" ]] || { why='bridge: the bridge returned no token'; return 1; }
            echo "::add-mask::$token"
          }
          # The token reaches git through the environment, never argv or a config file: no credential outlives the step.
          authed() {
            local basic
            basic=$(printf 'x-access-token:%s' "$token" | base64 | tr -d '\n')
            echo "::add-mask::$basic"
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0='http.https://github.com/.extraheader' GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $basic" git "$@" 2>"$err"
          }
          # A failed fetch, named by its class: git's own fetch lines say nothing of the private tree.
          fetch_why() {
            local e
            e=$(grep -E '^(fatal|error|remote):' "$err" | tail -2 | tr '\n' ' ' | tr -cd '[:print:]' | head -c 200)
            case "$e" in
              *'not found'* | *' 404'*) why="checkout: $1 404s (Repository not found) — $e" ;;
              *'expected'*'packfile'*) why="checkout: $1 ended before its packfile — $e" ;;
              *promisor*) why="checkout: $1 could not reach its promisor remote — $e" ;;
              *) why="checkout: $1 failed — $e" ;;
            esac
          }
          attempt() {
            mint || return 1
            git init -q . && { git remote remove origin 2>/dev/null; git remote add origin "$url"; } || { why='checkout: the workspace could not be initialised'; return 1; }
            authed fetch --no-tags --prune --no-recurse-submodules origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*' || { fetch_why 'the fetch of the private branches'; return 1; }
            if ! git cat-file -e "$IN_CHECKOUT_SHA^{commit}" 2>/dev/null; then
              authed fetch --no-tags --no-recurse-submodules origin "$IN_CHECKOUT_SHA" || { fetch_why "the fetch of checkout_sha $IN_CHECKOUT_SHA"; return 1; }
            fi
            git checkout -q --force --detach "$IN_CHECKOUT_SHA" 2>/dev/null || { why="checkout: checkout_sha $IN_CHECKOUT_SHA could not be checked out"; return 1; }
            rm -rf "$TRUSTED" && git init -q "$TRUSTED" && git -C "$TRUSTED" remote add origin "$url" && git -C "$TRUSTED" sparse-checkout set tooling/ci .github/actions || { why="checkout: $TRUSTED could not be initialised"; return 1; }
            authed -C "$TRUSTED" fetch --no-tags --depth 1 origin '+refs/heads/main:refs/remotes/origin/main' || { fetch_why "the fetch of private main into $TRUSTED"; return 1; }
            git -C "$TRUSTED" checkout -q --force -B main refs/remotes/origin/main 2>/dev/null || { why="checkout: private main could not be checked out into $TRUSTED"; return 1; }
          }
          for n in "${!wait_s[@]}"; do
            if (( n > 0 )); then
              echo "::warning::pool checkout attempt $n of ${#wait_s[@]} failed ($why); retrying in ${wait_s[n]} s with a fresh bridge token"
              sleep "${wait_s[n]}"
            fi
            if attempt; then
              echo "pool checkout: the private code at $IN_CHECKOUT_SHA and private main's tooling, attempt $((n + 1)) of ${#wait_s[@]}"
              exit 0
            fi
          done
          echo "::error::POOL-INFRA $why (after ${#wait_s[@]} attempts, each with a fresh bridge token)"
          exit 1
      - name: Keep private main's copies out of the checked-out tree
        run: printf '/.pool-trusted/\n' >> "$(git rev-parse --git-path info/exclude)"
      - name: Name the private commit (the shell prelude's identity, from the parent run)
        env:
          IN_SHA: ${{ inputs.sha }}
          IN_IDENTITY: ${{ inputs.identity }}
          IN_REPO: com-nikatru/Nikatru_Private
        run: |
          set -euo pipefail
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=$IN_SHA"
            echo "NIKATRU_EVENT_NAME=$(jq -r '.event // ""' <<<"$IN_IDENTITY")"
            ref=$(jq -r '.ref // ""' <<<"$IN_IDENTITY"); echo "NIKATRU_REF=$ref"; echo "NIKATRU_REF_NAME=${ref#refs/*/}"
            echo "NIKATRU_BASE_SHA=$(jq -r '.base_sha // ""' <<<"$IN_IDENTITY")"
            echo "NIKATRU_BASE_REF=$(jq -r '.base_ref // ""' <<<"$IN_IDENTITY")"
            echo "NIKATRU_PR=$(jq -r '.pr // ""' <<<"$IN_IDENTITY")"
            echo "NIKATRU_PRIVATE_REPO=$IN_REPO"
          } >> "$GITHUB_ENV"
      - uses: ./.pool-trusted/.github/actions/setup-node
      - name: The home job's work starts here
        run: 'true'
      - name: Every guard is tested and self-checking
        shell: node .pool-trusted/tooling/ci/quiet-step.mjs --name lane-guards.guard-meta.3 --default-shell {0}
        run: node tooling/ci/assert-guard-coverage.mjs
      - name: The ratchet the guard just wrote is the ratchet that was committed
        shell: node .pool-trusted/tooling/ci/quiet-step.mjs --name lane-guards.guard-meta.4 --default-shell {0}
        run: |
          set -euo pipefail
          if ! git diff --quiet -- tooling/ci/test/coverage-manifest.json; then
            echo "::error title=coverage-manifest.json was not regenerated::assert-guard-coverage.mjs rewrote the ratchet during this run, so the committed file is stale. Run \`node tooling/ci/assert-guard-coverage.mjs\` locally and commit the result. A manifest lower than the tree LOWERS the floor at merge, and nothing after that can see the step down."
            git --no-pager diff -- tooling/ci/test/coverage-manifest.json
            exit 1
          fi
          echo "ok  coverage-manifest.json is byte-identical to what this run derived"
      - name: Every ratchet moved the safe way against its base, or carries a dated lowering
        shell: node .pool-trusted/tooling/ci/quiet-step.mjs --name lane-guards.guard-meta.5 --default-shell {0}
        run: node tooling/ci/assert-ratchet-base.mjs
      - name: Guard tree walks cannot leave the tree
        shell: node .pool-trusted/tooling/ci/quiet-step.mjs --name lane-guards.guard-meta.6 --default-shell {0}
        run: node tooling/ci/assert-walks-bounded.mjs
      - name: A local script reads a workflow through workflow-scan, or refuses when blind
        shell: node .pool-trusted/tooling/ci/quiet-step.mjs --name lane-guards.guard-meta.7 --default-shell {0}
        run: node tooling/ci/assert-workflow-readers.mjs
      - name: A pool account changes by data alone
        shell: node .pool-trusted/tooling/ci/quiet-step.mjs --name lane-guards.guard-meta.8 --default-shell {0}
        run: node tooling/ci/assert-pool-portable.mjs
      - name: Every job a pull request runs is run by the parity preflight, or exempt with its reason
        shell: node .pool-trusted/tooling/ci/quiet-step.mjs --name lane-guards.guard-meta.9 --default-shell {0}
        run: node tooling/ci/assert-preflight-parity.mjs
      - name: No new test case is declared inside a loop, and the loop baseline only shrinks
        shell: node .pool-trusted/tooling/ci/quiet-step.mjs --name lane-guards.guard-meta.10 --default-shell {0}
        run: node tooling/ci/assert-no-loop-cases.mjs
      - name: A new mechanism claim arrives with its test or a recorded demotion, and the claim backlog only shrinks
        shell: node .pool-trusted/tooling/ci/quiet-step.mjs --name lane-guards.guard-meta.11 --default-shell {0}
        run: node tooling/ci/assert-mechanism-claims.mjs
      - name: An extension README's ungraded-fixture table says what the fixture-coverage baseline says
        shell: node .pool-trusted/tooling/ci/quiet-step.mjs --name lane-guards.guard-meta.12 --default-shell {0}
        run: node tooling/ci/assert-ungraded-baseline-doc.mjs
      - name: The enforcement index is what the tree says
        shell: node .pool-trusted/tooling/ci/quiet-step.mjs --name lane-guards.guard-meta.13 --default-shell {0}
        run: node tooling/ci/assert-enforcement-index.mjs
      - name: Every line of the app template is accounted for
        shell: node .pool-trusted/tooling/ci/quiet-step.mjs --name lane-guards.guard-meta.14 --default-shell {0}
        run: node tooling/ci/assert-chassis-ledger.mjs
      - name: Guards refuse an empty subject
        shell: node .pool-trusted/tooling/ci/quiet-step.mjs --name lane-guards.guard-meta.15 --default-shell {0}
        run: node tooling/ci/assert-guards-refuse-empty.mjs
      - name: No dead tracked files
        shell: node .pool-trusted/tooling/ci/quiet-step.mjs --name lane-guards.guard-meta.16 --default-shell {0}
        run: node tooling/scripts/assert-no-dead-files.mjs
      - name: Every tracked path is placed in the lane map, and every lane glob matches a file
        shell: node .pool-trusted/tooling/ci/quiet-step.mjs --name lane-guards.guard-meta.17 --default-shell {0}
        run: node tooling/ci/lane-detect.mjs --check
      - name: Main's newest merge carries its Rows line in the squash message
        shell: node .pool-trusted/tooling/ci/quiet-step.mjs --name lane-guards.guard-meta.18 --default-shell {0}
        if: ((fromJSON(inputs.identity).event) == 'push' || (fromJSON(inputs.identity).event) == 'workflow_dispatch') && (fromJSON(inputs.identity).ref || 'refs/heads/main') == 'refs/heads/main'
        run: node tooling/ci/assert-main-rows.mjs --ref "$GITHUB_SHA"
      - name: The CI docs match the workflows (gen-ci-map --check)
        shell: node .pool-trusted/tooling/ci/quiet-step.mjs --name lane-guards.guard-meta.19 --default-shell {0}
        run: node tooling/ci/gen-ci-map.mjs --check
      - name: The release runbook's arming lines match the register (channel-arming --check)
        shell: node .pool-trusted/tooling/ci/quiet-step.mjs --name lane-guards.guard-meta.20 --default-shell {0}
        run: node tooling/ci/channel-arming.mjs --check
      - name: The release runbook's §3 matches what a Release carries (gen-release-carries --check)
        shell: node .pool-trusted/tooling/ci/quiet-step.mjs --name lane-guards.guard-meta.21 --default-shell {0}
        run: node tooling/ci/gen-release-carries.mjs --check
      - name: The public shell is what the generator writes, and lets no outsider in (assert-public-shell)
        shell: node .pool-trusted/tooling/ci/quiet-step.mjs --name lane-guards.guard-meta.22 --default-shell {0}
        run: node tooling/ci/assert-public-shell.mjs
      - name: No shell workflow starts on an event that skips every job it has (assert-no-skipped-starts)
        shell: node .pool-trusted/tooling/ci/quiet-step.mjs --name lane-guards.guard-meta.23 --default-shell {0}
        run: node tooling/ci/assert-no-skipped-starts.mjs
      - name: Every source script reaches the public shell intact, read by a real YAML parser (shell-script-parity)
        shell: node .pool-trusted/tooling/ci/quiet-step.mjs --name lane-guards.guard-meta.24 --default-shell {0}
        run: python3 -I tooling/ci/shell-script-parity.py .
      - name: Guard headers cite code pinned to a commit, never by a bare line number
        shell: node .pool-trusted/tooling/ci/quiet-step.mjs --name lane-guards.guard-meta.25 --default-shell {0}
        env:
          GUARD_HEADER_CITATIONS_BASE: ${{ fromJSON(inputs.identity).base_ref && format('origin/{0}', fromJSON(inputs.identity).base_ref) || '' }}
        run: node tooling/ci/assert-guard-header-citations.mjs
      - name: Every changed path is mapped to a check, or declared ungraded (affected-guards --list)
        shell: node .pool-trusted/tooling/ci/quiet-step.mjs --name lane-guards.guard-meta.26 --default-shell {0}
        if: ${{ !cancelled() }}
        env:
          AFFECTED_BASE: ${{ fromJSON(inputs.identity).base_ref && format('origin/{0}', fromJSON(inputs.identity).base_ref) || '' }}
        run: node tooling/scripts/affected-guards.mjs --list --sha HEAD --base "${AFFECTED_BASE:-origin/main}"
