        run: >
          node tooling/ci/assert-android-vapt-manifest.mjs
          apps/${{ fromJSON(inputs.matrix).app }}/build/app/outputs/flutter-apk/app-release.apk
          --app ${{ fromJSON(inputs.matrix).app }}
