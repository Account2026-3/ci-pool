        shell: node .pool-trusted/tooling/ci/quiet-step.mjs --name lane-build.web-artifacts.9 --default-shell {0}
        run: node tooling/web/self-host-fallback-fonts.mjs apps/${{ fromJSON(inputs.matrix).app }}/build/web
