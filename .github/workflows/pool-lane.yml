              sleep "${wait_s[n]}"
            fi
            if attempt; then
              echo "pool checkout: the private code at $IN_CHECKOUT_SHA and private main's tooling, attempt $((n + 1)) of ${#wait_s[@]}"
              exit 0
            fi
          done
          echo "::error::POOL-INFRA $why (after ${#wait_s[@]} attempts, each with a fresh bridge token)"
          exit 1
      - name: Keep private main's copies out of the checked-out tree
        run: printf '/.pool-trusted/\n' >> "$(git rev-parse --git-path info/exclude)"
      - name: Name the private commit (the shell prelude's identity, from the parent run)
        env:
          IN_SHA: ${{ inputs.sha }}
          IN_IDENTITY: ${{ inputs.identity }}
          IN_REPO: com-nikatru/Nikatru_Private
        run: |
          set -euo pipefail
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=$IN_SHA"
            echo "NIKATRU_EVENT_NAME=$(jq -r '.event // ""' <<<"$IN_IDENTITY")"
            ref=$(jq -r '.ref // ""' <<<"$IN_IDENTITY"); echo "NIKATRU_REF=$ref"; echo "NIKATRU_REF_NAME=${ref#refs/*/}"
            echo "NIKATRU_BASE_SHA=$(jq -r '.base_sha // ""' <<<"$IN_IDENTITY")"
            echo "NIKATRU_BASE_REF=$(jq -r '.base_ref // ""' <<<"$IN_IDENTITY")"
            echo "NIKATRU_PR=$(jq -r '.pr // ""' <<<"$IN_IDENTITY")"
            echo "NIKATRU_PRIVATE_REPO=$IN_REPO"
          } >> "$GITHUB_ENV"
      - uses: ./.pool-trusted/.github/actions/setup-node
      - name: The home job's work starts here
        run: 'true'
      - run: node "$GITHUB_WORKSPACE/tooling/ops/npm-ci-retry.mjs" -- npm ci
        shell: node ../../.pool-trusted/tooling/ci/quiet-step.mjs --name lane-workers.worker.3 --default-shell {0}
        working-directory: services/${{ fromJSON(inputs.matrix).worker }}
      - run: npx tsc --noEmit
        shell: node ../../.pool-trusted/tooling/ci/quiet-step.mjs --name lane-workers.worker.4 --default-shell {0}
        working-directory: services/${{ fromJSON(inputs.matrix).worker }}
      - run: npm test
        shell: node ../../.pool-trusted/tooling/ci/quiet-step.mjs --name lane-workers.worker.5 --default-shell {0}
        working-directory: services/${{ fromJSON(inputs.matrix).worker }}
      - run: npx wrangler deploy --dry-run
        shell: node ../../.pool-trusted/tooling/ci/quiet-step.mjs --name lane-workers.worker.6 --default-shell {0}
        working-directory: services/${{ fromJSON(inputs.matrix).worker }}
      - run: npx wrangler deploy --env sandbox --dry-run
        shell: node ../../.pool-trusted/tooling/ci/quiet-step.mjs --name lane-workers.worker.7 --default-shell {0}
        working-directory: services/${{ fromJSON(inputs.matrix).worker }}
