        shell: node .pool-trusted/tooling/ci/quiet-step.mjs --name lane-build.android-artifacts.20 --default-shell {0}
        run: >
          node tooling/ci/assert-android-vapt-manifest.mjs
          ${{ steps.agi_apk.outputs.apk }}
          --app ${{ fromJSON(inputs.matrix).app }}
      - name: The apps.gov.in .apk's native libraries are aligned for a 16 KB memory page
        shell: node .pool-trusted/tooling/ci/quiet-step.mjs --name lane-build.android-artifacts.21 --default-shell {0}
        run: >
