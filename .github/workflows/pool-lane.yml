        run: node tooling/web/fingerprint-web-build.mjs apps/${{ fromJSON(inputs.matrix).app }}/build/web
      - name: Launch the built bundle once
        shell: node .pool-trusted/tooling/ci/quiet-step.mjs --name lane-build.web-artifacts.15 --default-shell {0}
        run: >
          node tooling/smoke/smoke-web-artifact.mjs apps/${{ fromJSON(inputs.matrix).app }}/build/web
