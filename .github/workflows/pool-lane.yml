        id: gradle-prune
        if: ((env.NIKATRU_REF || (fromJSON(inputs.identity).ref || 'refs/heads/main')) == 'refs/heads/main' && contains(fromJSON('["push","schedule","workflow_dispatch"]'), env.NIKATRU_EVENT_NAME || (fromJSON(inputs.identity).event)) && !env.NIKATRU_PR) && steps.gradle-cache.outputs.cache-hit != 'true' && fromJSON(inputs.matrix).app == fromJSON(fromJSON(inputs.needs)['prepare']['apps'])[0]
        run: >
          node tooling/ci/gradle-cache-prune.mjs
          --gradle-home "$HOME/.gradle"
          --wrapper apps/${{ fromJSON(inputs.matrix).app }}/android/gradle/wrapper/gradle-wrapper.properties
          --stop apps/${{ fromJSON(inputs.matrix).app }}/android
          --ceiling-mib 1024
      - name: Save the Gradle caches (a run of main only, on a key miss, from one matrix leg, within its ceiling)
        if: ((env.NIKATRU_REF || (fromJSON(inputs.identity).ref || 'refs/heads/main')) == 'refs/heads/main' && contains(fromJSON('["push","schedule","workflow_dispatch"]'), env.NIKATRU_EVENT_NAME || (fromJSON(inputs.identity).event)) && !env.NIKATRU_PR) && steps.gradle-cache.outputs.cache-hit != 'true' && fromJSON(inputs.matrix).app == fromJSON(fromJSON(inputs.needs)['prepare']['apps'])[0] && steps.gradle-prune.outputs.fits == 'true'
