        shell: node .pool-trusted/tooling/ci/quiet-step.mjs --name lane-build.web-artifacts.10 --default-shell {0}
        run: node tooling/web/self-host-fallback-fonts.mjs --check apps/${{ fromJSON(inputs.matrix).app }}/build/web
      - name: Every asset the build actually shipped has a licence row
        shell: node .pool-trusted/tooling/ci/quiet-step.mjs --name lane-build.web-artifacts.11 --default-shell {0}
        run: node tooling/ci/assert-licence-register.mjs . --bundle apps/${{ fromJSON(inputs.matrix).app }}/build/web/assets --app ${{ fromJSON(inputs.matrix).app }}
      - name: Install glitchtip-cli (pinned by version AND by digest)
        shell: node .pool-trusted/tooling/ci/quiet-step.mjs --name lane-build.web-artifacts.12 --default-shell {0}
        run: node tooling/ci/install-pinned-tool.mjs glitchtip-cli --out "$RUNNER_TEMP"
      - name: Inject debug ids into the web bundle, as deploy-web does before its smoke
